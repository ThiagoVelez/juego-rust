name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de Bevy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  smoke:
    name: Arranque con pantalla virtual (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb mesa-vulkan-drivers libvulkan1
      - run: cargo build -p survivalforest-client
      - name: Arrancar, capturar y salir
        run: |
          export XDG_RUNTIME_DIR=/tmp/rt; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
          xvfb-run -a -s "-screen 0 1280x720x24" ./target/debug/survivalforest --smoke 40
          test -s smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-smoke
          path: smoke.png
          if-no-files-found: ignore

  build:
    name: Compilar versión (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de Bevy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo build --release -p survivalforest-client
      - name: Empaquetar
        shell: bash
        run: |
          mkdir -p dist/SurvivalForest
          cp -r assets dist/SurvivalForest/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/SurvivalForest/
          if [ "$RUNNER_OS" = "Windows" ]; then cp target/release/survivalforest.exe dist/SurvivalForest/; else cp target/release/survivalforest dist/SurvivalForest/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: survivalforest-${{ runner.os }}
          path: dist/SurvivalForest
